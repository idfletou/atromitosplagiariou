name: Update standings & cup

# Scrapes the league table and cup run from epsm.gr and commits the JSON in
# src/data/. The commit triggers a Cloudflare Pages rebuild, so the site
# refreshes ~1-2 min later. If a scrape fails or looks empty, that script exits
# without writing, so the last-good data is kept.

on:
  schedule:
    # Minutes are deliberately off :00 — GitHub delays/drops scheduled runs most
    # at the top of the hour. These still map to ~06:23/11:23 and ~16:43/18:43/
    # 20:43 UTC. GitHub scheduling is best-effort, so the multiple weekend slots
    # give redundancy: if one is dropped, the next still catches the result.
    - cron: "23 6,11 * * *" # every day ~06:23 & ~11:23 UTC
    - cron: "43 16,18,20 * * 0,6" # Sat & Sun afternoon/evening (fresh matchday results)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run scrape
      - name: Commit if data changed
        run: |
          if [ -n "$(git status --porcelain src/data/standings.json src/data/fixtures.json src/data/cup.json)" ]; then
            git config user.name "standings-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/standings.json src/data/fixtures.json src/data/cup.json
            git commit -m "chore: update standings, fixtures & cup"
            git push
          else
            echo "No changes."
          fi
